[package]
name = "flipdf"
version = "1.0.4"
edition = "2021"
authors = ["Masanari Higashi"]
description = "Merge duplex-scanned PDFs into proper page order - for home scanners without auto-duplex"
license = "MIT"
repository = "https://github.com/M-Igashi/flipdf"
keywords = ["pdf", "duplex", "scanner", "merge", "brother"]
categories = ["command-line-utilities"]
exclude = ["CLAUDE.md"]

[[bin]]
name = "flipdf"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
anyhow = "1.0"
tempfile = "3.27"
glob = "0.3"
chrono = "0.4"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build for macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7  # stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Build for x86_64
        run: cargo build --release --target x86_64-apple-darwin

      - name: Build for aarch64
        run: cargo build --release --target aarch64-apple-darwin

      - name: Create Universal Binary
        run: |
          mkdir -p target/release
          lipo -create \
            target/x86_64-apple-darwin/release/flipdf \
            target/aarch64-apple-darwin/release/flipdf \
            -output target/release/flipdf

      - name: Create tarball
        env:
          TAG: ${{ github.ref_name }}
        run: |
          cd target/release
          tar -czvf "flipdf-${TAG}-macos.tar.gz" flipdf

      - name: Calculate SHA256
        id: sha256
        env:
          TAG: ${{ github.ref_name }}
        run: |
          SHA256=$(shasum -a 256 "target/release/flipdf-${TAG}-macos.tar.gz" | awk '{print $1}')
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-binary
          path: target/release/flipdf-${{ github.ref_name }}-macos.tar.gz

      - name: Save SHA256
        env:
          SHA256: ${{ steps.sha256.outputs.sha256 }}
        run: echo "$SHA256" > sha256.txt

      - name: Upload SHA256
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sha256
          path: sha256.txt

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-binary

      - name: Create Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b  # v2
        with:
          files: flipdf-${{ github.ref_name }}-macos.tar.gz
          generate_release_notes: true

  update-homebrew:
    name: Update Homebrew
    needs: [build, release]
    runs-on: ubuntu-latest
    steps:
      - name: Download SHA256
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sha256

      - name: Read SHA256
        id: sha256
        run: |
          SHA256=$(cat sha256.txt)
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT

      - name: Update Homebrew formula
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ github.ref_name }}
          FORMULA_SHA256: ${{ steps.sha256.outputs.sha256 }}
        run: |
          VERSION_NUM="${TAG#v}"

          git clone https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/M-Igashi/homebrew-tap.git
          cd homebrew-tap

          cat > Formula/flipdf.rb << FORMULA
          class Flipdf < Formula
            desc "CLI tool to reverse page order in PDF files"
            homepage "https://github.com/M-Igashi/flipdf"
            url "https://github.com/M-Igashi/flipdf/releases/download/${TAG}/flipdf-${TAG}-macos.tar.gz"
            sha256 "${FORMULA_SHA256}"
            version "${VERSION_NUM}"
            license "MIT"

            def install
              bin.install "flipdf"
            end

            test do
              assert_match "flipdf", shell_output("#{bin}/flipdf --help")
            end
          end
          FORMULA

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/flipdf.rb
          git commit -m "flipdf ${VERSION_NUM}"
          git push

name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build for macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Build for x86_64
        run: cargo build --release --target x86_64-apple-darwin

      - name: Build for aarch64
        run: cargo build --release --target aarch64-apple-darwin

      - name: Create Universal Binary
        run: |
          mkdir -p target/release
          lipo -create \
            target/x86_64-apple-darwin/release/flipdf \
            target/aarch64-apple-darwin/release/flipdf \
            -output target/release/flipdf

      - name: Create tarball
        run: |
          cd target/release
          tar -czvf flipdf-${{ github.ref_name }}-macos.tar.gz flipdf

      - name: Calculate SHA256
        id: sha256
        run: |
          SHA256=$(shasum -a 256 target/release/flipdf-${{ github.ref_name }}-macos.tar.gz | awk '{print $1}')
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-binary
          path: target/release/flipdf-${{ github.ref_name }}-macos.tar.gz

      - name: Save SHA256
        run: echo "${{ steps.sha256.outputs.sha256 }}" > sha256.txt

      - name: Upload SHA256
        uses: actions/upload-artifact@v4
        with:
          name: sha256
          path: sha256.txt

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-binary

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: flipdf-${{ github.ref_name }}-macos.tar.gz
          generate_release_notes: true

  update-homebrew:
    name: Update Homebrew
    needs: [build, release]
    runs-on: ubuntu-latest
    steps:
      - name: Download SHA256
        uses: actions/download-artifact@v4
        with:
          name: sha256

      - name: Read SHA256
        id: sha256
        run: |
          SHA256=$(cat sha256.txt)
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT

      - name: Update Homebrew formula
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION_NUM="${VERSION#v}"
          SHA256="${{ steps.sha256.outputs.sha256 }}"
          
          git clone https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/M-Igashi/homebrew-tap.git
          cd homebrew-tap
          
          cat > Formula/flipdf.rb << FORMULA
          class Flipdf < Formula
            desc "CLI tool to reverse page order in PDF files"
            homepage "https://github.com/M-Igashi/flipdf"
            url "https://github.com/M-Igashi/flipdf/releases/download/${VERSION}/flipdf-${VERSION}-macos.tar.gz"
            sha256 "${SHA256}"
            version "${VERSION_NUM}"
            license "MIT"

            def install
              bin.install "flipdf"
            end

            test do
              assert_match "flipdf", shell_output("#{bin}/flipdf --help")
            end
          end
          FORMULA
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/flipdf.rb
          git commit -m "flipdf ${VERSION_NUM}"
          git push

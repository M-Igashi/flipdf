name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build for macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Build for x86_64
        run: cargo build --release --target x86_64-apple-darwin

      - name: Build for aarch64
        run: cargo build --release --target aarch64-apple-darwin

      - name: Create Universal Binary
        run: |
          mkdir -p target/release
          lipo -create \
            target/x86_64-apple-darwin/release/flipdf \
            target/aarch64-apple-darwin/release/flipdf \
            -output target/release/flipdf

      - name: Create tarball
        run: |
          cd target/release
          tar -czvf flipdf-${{ github.ref_name }}-macos.tar.gz flipdf
          shasum -a 256 flipdf-${{ github.ref_name }}-macos.tar.gz > flipdf-${{ github.ref_name }}-macos.tar.gz.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-binary
          path: |
            target/release/flipdf-${{ github.ref_name }}-macos.tar.gz
            target/release/flipdf-${{ github.ref_name }}-macos.tar.gz.sha256

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-binary

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            flipdf-${{ github.ref_name }}-macos.tar.gz
            flipdf-${{ github.ref_name }}-macos.tar.gz.sha256
          generate_release_notes: true
